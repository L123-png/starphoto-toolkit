<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>星光图匠 StarPhoto Toolkit</title>
  <script src="https://cdn.jsdelivr.net/gh/kilobtye/potrace/potrace.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gifshot/0.3.2/gifshot.min.js"></script>
  <style>
    :root {
      --bg: #050518;
      --card: rgba(20, 22, 50, 0.65);
      --text: #e8ecff;
      --muted: #9aa3c7;
      --accent1: #00f0ff;
      --accent2: #bc13fe;
      --accent3: #ff2a6d;
      --accent4: #39ff14;
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: radial-gradient(ellipse at top, #1a0b3a 0%, #0a0c28 50%, #000 100%);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }
    #stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .star {
      position: absolute;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 4px #fff, 0 0 10px var(--accent1);
      animation: twinkle var(--dur) ease-in-out infinite;
      opacity: var(--op);
    }
    .shooting {
      position: absolute;
      width: 120px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent1), transparent);
      transform: rotate(-35deg);
      animation: shoot 5s linear infinite;
      opacity: 0;
      filter: drop-shadow(0 0 6px var(--accent1));
    }
    @keyframes twinkle { 0%, 100% { opacity: var(--op); } 50% { opacity: 0.15; } }
    @keyframes shoot {
      0% { transform: translateX(-200px) translateY(0) rotate(-35deg); opacity: 0; }
      10% { opacity: 1; }
      100% { transform: translateX(100vw) translateY(-60vh) rotate(-35deg); opacity: 0; }
    }
    header { position: relative; z-index: 1; text-align: center; padding: 70px 20px 30px; }
    header h1 {
      margin: 0;
      font-size: clamp(2.2rem, 5.5vw, 4rem);
      letter-spacing: 2px;
      background: linear-gradient(90deg, var(--accent1), var(--accent2), var(--accent3), var(--accent1));
      background-size: 300% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientMove 6s linear infinite;
      filter: drop-shadow(0 0 20px rgba(0, 240, 255, 0.35));
    }
    @keyframes gradientMove { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }
    .subtitle { color: var(--muted); margin-top: 12px; font-size: 1.05rem; }
    main { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; padding: 0 20px 100px; }
    .search { display: flex; justify-content: center; margin-bottom: 22px; }
    .search input {
      width: min(520px, 100%);
      padding: 13px 22px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(0, 0, 0, 0.35);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: 0.2s;
    }
    .search input:focus { border-color: var(--accent1); box-shadow: 0 0 20px rgba(0, 240, 255, 0.2); }
    .tabs {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 10px 0 18px;
      margin-bottom: 6px;
      scrollbar-width: thin;
    }
    .tabs::-webkit-scrollbar { height: 6px; }
    .tabs::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 4px; }
    .tab {
      flex: 0 0 auto;
      padding: 9px 18px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.04);
      color: var(--muted);
      cursor: pointer;
      transition: 0.2s;
      font-size: 0.88rem;
    }
    .tab:hover, .tab.active {
      background: linear-gradient(90deg, var(--accent2), var(--accent3));
      color: #fff;
      border-color: transparent;
      box-shadow: 0 0 18px rgba(188, 19, 254, 0.45);
      transform: translateY(-2px);
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
    .card {
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius);
      padding: 22px;
      cursor: pointer;
      transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(8px);
    }
    .card::before {
      content: '✦';
      position: absolute;
      top: 6px;
      right: 12px;
      color: rgba(255, 255, 255, 0.08);
      font-size: 2.2rem;
      line-height: 1;
      transition: 0.3s;
    }
    .card:hover::before { color: var(--accent1); transform: rotate(20deg) scale(1.2); text-shadow: 0 0 15px var(--accent1); }
    .card:hover {
      transform: translateY(-8px);
      border-color: var(--accent1);
      box-shadow: 0 16px 45px rgba(0, 240, 255, 0.18), inset 0 0 25px rgba(0, 240, 255, 0.06);
    }
    .card h3 { margin: 0 0 8px; font-size: 1.05rem; color: #fff; }
    .card p { margin: 0; font-size: 0.84rem; color: var(--muted); line-height: 1.45; }
    .card .badge {
      display: inline-block;
      margin-top: 14px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.7rem;
      background: rgba(0, 240, 255, 0.12);
      color: var(--accent1);
      border: 1px solid rgba(0, 240, 255, 0.18);
    }
    .modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(8px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }
    .modal.open { opacity: 1; pointer-events: auto; }
    .modal-content {
      width: min(920px, 94vw);
      max-height: 90vh;
      overflow-y: auto;
      background: linear-gradient(180deg, #151a3d 0%, #0b0e26 100%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 26px;
      padding: 26px;
      box-shadow: 0 24px 90px rgba(0, 0, 0, 0.7);
      position: relative;
    }
    .modal-content::-webkit-scrollbar { width: 8px; }
    .modal-content::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 4px; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .modal-header h2 {
      margin: 0;
      font-size: 1.55rem;
      background: linear-gradient(90deg, var(--accent1), var(--accent3));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .close-btn { background: none; border: none; color: var(--muted); font-size: 2rem; cursor: pointer; line-height: 1; transition: 0.2s; }
    .close-btn:hover { color: #fff; transform: rotate(90deg); }
    .desc { color: var(--muted); margin-bottom: 20px; font-size: 0.92rem; }
    .field { display: flex; flex-direction: column; gap: 7px; margin-bottom: 14px; }
    .field span { font-size: 0.85rem; color: var(--muted); }
    .field input, .field select, .field textarea {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(0, 0, 0, 0.28);
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      transition: 0.2s;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent1); }
    .field input[type="range"] { padding: 0; accent-color: var(--accent1); }
    .range-label { display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
    .range-label span:nth-child(2) { color: var(--accent1); font-weight: 600; }
    .actions { display: flex; gap: 12px; margin: 20px 0; flex-wrap: wrap; }
    .btn {
      padding: 11px 20px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-size: 0.92rem;
      transition: 0.2s;
      color: #fff;
      background: linear-gradient(90deg, var(--accent2), var(--accent3));
      box-shadow: 0 0 18px rgba(188, 19, 254, 0.35);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover { transform: scale(1.04); box-shadow: 0 0 28px rgba(188, 19, 254, 0.55); }
    .btn.secondary { background: rgba(255, 255, 255, 0.08); color: var(--text); box-shadow: none; }
    .btn.secondary:hover { background: rgba(255, 255, 255, 0.15); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .preview {
      min-height: 140px;
      border-radius: 18px;
      background: rgba(0, 0, 0, 0.28);
      border: 1px dashed rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      overflow: auto;
      flex-direction: column;
      gap: 12px;
    }
    .preview img, .preview svg { max-width: 100%; max-height: 52vh; object-fit: contain; border-radius: 10px; }
    .preview .gallery { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    .preview .gallery img { max-height: 130px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.1); }
    .note { padding: 12px; border-radius: 10px; background: rgba(255, 255, 255, 0.05); color: var(--muted); font-size: 0.84rem; line-height: 1.5; }
    table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
    th, td { padding: 9px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); text-align: left; }
    th { color: var(--accent1); }
    .empty { color: var(--muted); font-size: 0.9rem; }
    ::selection { background: rgba(0, 240, 255, 0.25); color: #fff; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.25); }
    .modal.wide .modal-content { width: min(1600px, 98vw); max-height: 96vh; }
    .modal.wide .preview { background: transparent; border: none; padding: 0; overflow: visible; display: block; }

    /* WeChat generator */
    .wx-layout { display: grid; grid-template-columns: 380px 1fr; gap: 22px; align-items: start; }
    .wx-left { display: flex; flex-direction: column; gap: 14px; max-height: calc(96vh - 160px); overflow-y: auto; padding-right: 6px; }
    .wx-right { display: flex; flex-direction: column; align-items: center; gap: 14px; position: sticky; top: 0; max-height: calc(96vh - 160px); overflow: visible; }
    .wx-section { background: rgba(0, 0, 0, 0.22); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; padding: 14px; }
    .wx-section h4 { margin: 0 0 12px; font-size: 0.95rem; color: var(--accent1); letter-spacing: 0.5px; }
    .wx-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
    .wx-field { display: flex; flex-direction: column; gap: 4px; }
    .wx-field span { font-size: 0.78rem; color: var(--muted); }
    .wx-field input, .wx-field select, .wx-field textarea { padding: 7px 9px; border-radius: 9px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); color: var(--text); font-size: 0.85rem; outline: none; }
    .wx-field input:focus, .wx-field select:focus, .wx-field textarea:focus { border-color: var(--accent1); }
    .wx-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .wx-row .wx-field { flex: 1; min-width: 90px; }

    /* user list as vertical side-by-side cards */
    .wx-user-list { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; }
    .wx-user-item { flex: 0 0 auto; width: 118px; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px; border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; background: rgba(255,255,255,0.03); transition: 0.2s; }
    .wx-user-item:hover { border-color: rgba(0,240,255,0.3); }
    .wx-user-item.me { background: rgba(0,240,255,0.1); border-color: rgba(0,240,255,0.25); box-shadow: 0 0 16px rgba(0,240,255,0.1); }
    .wx-user-item .top { display: flex; justify-content: space-between; width: 100%; }
    .wx-avatar-thumb { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; background: rgba(255,255,255,0.1); cursor: pointer; border: 2px dashed rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--muted); transition: 0.2s; position: relative; overflow: hidden; }
    .wx-avatar-thumb:hover { border-color: var(--accent1); box-shadow: 0 0 12px rgba(0,240,255,0.3); }
    .wx-avatar-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .wx-avatar-thumb .add { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.35); font-size: 22px; color: #fff; }
    .wx-user-item input[type="text"] { width: 100%; text-align: center; padding: 5px; font-size: 0.82rem; }
    .wx-user-item input[type="color"] { width: 28px; height: 28px; border: none; background: none; cursor: pointer; }
    .wx-user-badge { font-size: 0.68rem; color: var(--accent1); text-align: center; }
    .wx-user-actions { display: flex; gap: 6px; align-items: center; }
    .wx-mini-btn { padding: 7px 14px; border-radius: 999px; border: none; cursor: pointer; font-size: 0.82rem; color: #fff; background: linear-gradient(90deg, var(--accent2), var(--accent3)); transition: 0.2s; font-weight: 500; }
    .wx-mini-btn:hover { transform: translateY(-1px); box-shadow: 0 0 16px rgba(188, 19, 254, 0.45); }
    .wx-mini-btn.secondary { background: rgba(255,255,255,0.08); }
    .wx-mini-btn.secondary:hover { background: rgba(255,255,255,0.15); }
    .wx-mini-btn.small { padding: 5px 10px; font-size: 0.75rem; }
    .wx-add-btns { display: flex; flex-wrap: wrap; gap: 8px; }
    .wx-export-btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .wx-toggle { position: relative; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; font-size: 0.78rem; color: var(--muted); }
    .wx-toggle input { position: absolute; opacity: 0; width: 0; height: 0; }
    .wx-toggle .slider { position: relative; width: 42px; height: 22px; background: rgba(255,255,255,0.12); border-radius: 999px; transition: 0.25s; }
    .wx-toggle .slider::after { content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; background: #fff; border-radius: 50%; transition: 0.25s; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
    .wx-toggle input:checked + .slider { background: linear-gradient(90deg, var(--accent2), var(--accent3)); box-shadow: 0 0 12px rgba(188,19,254,0.4); }
    .wx-toggle input:checked + .slider::after { transform: translateX(20px); }
    .wx-theme-switch { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.04); border-radius: 999px; padding: 5px 5px 5px 14px; font-size: 0.82rem; color: var(--muted); }
    .wx-theme-btn { border: none; background: transparent; color: var(--muted); cursor: pointer; padding: 5px 12px; border-radius: 999px; transition: 0.2s; font-size: 0.8rem; }
    .wx-theme-btn.active { background: linear-gradient(90deg, var(--accent2), var(--accent3)); color: #fff; box-shadow: 0 0 12px rgba(188,19,254,0.35); }
    .wx-msglist { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .wx-msgitem { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07); border-radius: 12px; padding: 10px; }
    .wx-msgitem-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 0.8rem; color: var(--muted); }
    .wx-type-badge { padding: 2px 8px; border-radius: 999px; background: rgba(0,240,255,0.12); color: var(--accent1); font-size: 0.7rem; }
    .wx-del { background: none; border: none; color: #ff6b6b; cursor: pointer; font-size: 1rem; line-height: 1; }
    .wx-radio { appearance: none; width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.2); border-radius: 50%; cursor: pointer; position: relative; transition: 0.2s; }
    .wx-radio:checked { border-color: var(--accent1); box-shadow: 0 0 10px rgba(0,240,255,0.35); }
    .wx-radio:checked::after { content: ''; position: absolute; inset: 3px; background: var(--accent1); border-radius: 50%; }
    .wx-voice-durations { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
    .wx-voice-durations button { padding: 4px 10px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); color: var(--muted); cursor: pointer; font-size: 0.75rem; transition: 0.2s; }
    .wx-voice-durations button:hover, .wx-voice-durations button.active { background: linear-gradient(90deg, var(--accent2), var(--accent3)); color: #fff; border-color: transparent; }
    .wx-amount-presets { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
    .wx-amount-presets button { padding: 4px 10px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); color: var(--muted); cursor: pointer; font-size: 0.75rem; transition: 0.2s; }
    .wx-amount-presets button:hover { background: rgba(255,255,255,0.12); }

    /* phone frame tuya 1170x2532 canvas, scaled to fit preview area */
    .wx-phone { width: 1170px; height: 2532px; background: #0a0a0a; border-radius: 156px; position: relative; box-shadow: 0 72px 210px rgba(0,0,0,0.7), inset 0 0 0 3px rgba(255,255,255,0.12); display: flex; flex-direction: column; overflow: hidden; transform: scale(var(--wx-scale, 1)); transform-origin: top center; }
    .wx-phone::before { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 390px; height: 84px; background: #000; border-radius: 0 0 58px 58px; z-index: 10; }
    .wx-screen { width: 1170px; height: 2532px; background: #ededed; overflow: hidden; display: flex; flex-direction: column; color: #000; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif; position: relative; font-size: 36px; }
    .wx-screen.dark { background: #111; color: #fff; }

    /* status bar */
    .wx-statusbar { height: 132px; display: flex; align-items: center; justify-content: space-between; padding: 0 43px 0 95px; font-size: 45px; font-weight: 600; background: #ededed; color: #000; }
    .wx-screen.dark .wx-statusbar { background: #111; color: #fff; }
    .wx-status-left, .wx-status-right { display: flex; align-items: center; gap: 18px; }
    .wx-signal { display: flex; align-items: flex-end; gap: 5px; height: 36px; }
    .wx-signal i { width: 8px; background: #000; border-radius: 2px; opacity: 0.22; }
    .wx-screen.dark .wx-signal i { background: #fff; }
    .wx-signal i.on { opacity: 1; }
    .wx-signal i:nth-child(1) { height: 10px; }
    .wx-signal i:nth-child(2) { height: 16px; }
    .wx-signal i:nth-child(3) { height: 22px; }
    .wx-signal i:nth-child(4) { height: 28px; }
    .wx-wifi { display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .wx-wifi i { width: 42px; height: 18px; border-radius: 21px 21px 0 0; border-top: 5px solid #000; border-left: 5px solid #000; border-right: 5px solid #000; opacity: 0.22; box-sizing: border-box; }
    .wx-screen.dark .wx-wifi i { border-color: #fff; }
    .wx-wifi i.on { opacity: 1; }
    .wx-wifi i:nth-child(2) { width: 27px; height: 12px; }
    .wx-wifi i:nth-child(3) { width: 13px; height: 9px; border-radius: 4.5px 4.5px 0 0; border-width: 4px; }
    .wx-net { font-size: 36px; font-weight: 500; }
    .wx-battery { display: flex; align-items: center; gap: 9px; position: relative; }
    .wx-battery-body { width: 75px; height: 36px; border: 3px solid #000; border-radius: 6px; padding: 4px 16px 4px 4px; position: relative; }
    .wx-screen.dark .wx-battery-body { border-color: #fff; }
    .wx-battery-body::after { content: ''; position: absolute; right: -8px; top: 8px; width: 6px; height: 16px; background: #000; border-radius: 0 3px 3px 0; }
    .wx-screen.dark .wx-battery-body::after { background: #fff; }
    .wx-battery-fill { height: 100%; background: #000; border-radius: 3px; }
    .wx-screen.dark .wx-battery-fill { background: #fff; }
    .wx-battery.charging .wx-battery-fill { background: #65c466; }
    .wx-battery .bolt { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 28px; color: #fff; z-index: 1; }

    /* nav bar */
    .wx-navbar { height: 132px; display: flex; align-items: center; justify-content: space-between; padding: 0 50px; background: #ededed; border-bottom: 1px solid #d5d5d5; position: relative; }
    .wx-screen.dark .wx-navbar { background: #111; border-bottom-color: #333; }
    .wx-nav-left { width: 210px; display: flex; align-items: center; }
    .wx-nav-center { flex: 1; display: flex; justify-content: center; }
    .wx-nav-title { font-size: 51px; font-weight: 500; color: #000; display: flex; align-items: center; max-width: 630px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .wx-screen.dark .wx-nav-title { color: #fff; }

<body>
  <div id="stars"></div>
  <header>
    <h1>星光图匠 StarPhoto Toolkit</h1>
    <p class="subtitle">一站式本地图像与创意工具箱</p>
  </header>
  <main>
    <div class="search">
      <input type="text" id="searchInput" placeholder="搜索工具名称或功能…">
    </div>
    <nav class="tabs" id="tabs"></nav>
    <div class="grid" id="grid"></div>
  </main>

  <div class="modal" id="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">工具</h2>

      </div>

      <div class="actions">
        <button class="btn" id="runBtn">✨ 执行处理</button>
        <button class="btn secondary" id="downloadBtn" disabled>⬇ 下载结果</button>
      </div>
      <div class="preview" id="modalPreview"><span class="empty">处理结果将在这里预览</span></div>
    </div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    let resultBlob = null, resultName = 'result.png';
    let resultBlobs = [];

    const categories = [

      { id: 'anti-duplicate', cat: 'other', name: '图片防重复检测处理', desc: '对像素施加轻微扰动，降低重复识别率。' },
      { id: 'img-list', cat: 'other', name: '图像列表读取', desc: '批量读取选中图片的名称、尺寸与大小。' },
      { id: 'img-extract', cat: 'other', name: 'IMG标签图像链接提取', desc: '从 HTML 源码中提取所有 IMG 的 src。' },
      { id: 'dpi', cat: 'other', name: '修改分辨率DPI', desc: '修改 PNG/JPEG 的 DPI 元数据（浏览器端实现）。' },
      { id: 'resize', cat: 'other', name: '图片尺寸大小修改', desc: '按指定宽高等比或自由缩放图片。' },
      { id: 'wechat-generator', cat: 'wechat', name: '微信对话生成器', desc: '模拟 iPhone 微信聊天界面，支持文字、图片、语音、红包、转账消息并导出 PNG/视频/GIF。' }
    ];

    // ---------- utilities ----------
    function readFile(file) {
      return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = e => resolve(e.target.result);
        r.onerror = reject;
        r.readAsDataURL(file);
      });
    }
    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error('无法加载图片'));
        img.src = src;
      });
    }
    async function fileToImage(file) { return loadImage(await readFile(file)); }
    function createCanvas(w, h) {
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      return c;
    }
    function canvasToBlob(canvas, mime = 'image/png', quality) {
      return new Promise(resolve => canvas.toBlob(resolve, mime, quality));
    }
    function getExt(name) {
      const i = name.lastIndexOf('.');
      return i === -1 ? '' : name.slice(i + 1).toLowerCase();
    }
    function changeExt(name, ext) {
      return name.replace(/\.[^.]+$/, '') + ext;
    }
    function noExt(name) { return name.replace(/\.[^.]+$/, ''); }
    function prefixName(name, prefix) { return prefix + name; }

    function encodeBMP(canvas) {
      const ctx = canvas.getContext('2d');
      const { data, width, height } = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const rowSize = Math.ceil(width * 3 / 4) * 4;
      const pixelArraySize = rowSize * height;
      const fileSize = 54 + pixelArraySize;
      const buffer = new ArrayBuffer(fileSize);
      const v = new DataView(buffer);
      const bytes = new Uint8Array(buffer);
      bytes[0] = 0x42; bytes[1] = 0x4D;
      v.setUint32(2, fileSize, true);
      v.setUint32(10, 54, true);
      v.setUint32(14, 40, true);
      v.setInt32(18, width, true);
      v.setInt32(22, height, true);
      v.setUint16(26, 1, true);
      v.setUint16(28, 24, true);
      v.setUint32(34, pixelArraySize, true);
      v.setUint32(38, 2835, true);
      v.setUint32(42, 2835, true);
      let offset = 54;
      for (let y = height - 1; y >= 0; y--) {
        for (let x = 0; x < width; x++) {
          const i = (y * width + x) * 4;
          bytes[offset++] = data[i + 2];
          bytes[offset++] = data[i + 1];
          bytes[offset++] = data[i];
        }
        const pad = rowSize - width * 3;
        for (let p = 0; p < pad; p++) bytes[offset++] = 0;
      }
      return new Blob([buffer], { type: 'image/bmp' });
    }

    // CRC32 for PNG DPI chunk
    function makeCrcTable() {
      const table = new Uint32Array(256);
      for (let n = 0; n < 256; n++) {
        let c = n;
        for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
        table[n] = c;
      }
      return table;
    }
    const crcTable = makeCrcTable();
    function crc32(buf) {
      let c = -1;
      for (let i = 0; i < buf.length; i++) c = (c >>> 8) ^ crcTable[(c ^ buf[i]) & 0xFF];
      return (c ^ -1) >>> 0;
    }
    function u32be(n) { return [(n >>> 24) & 0xFF, (n >>> 16) & 0xFF, (n >>> 8) & 0xFF, n & 0xFF]; }
    function strBytes(s) { return new TextEncoder().encode(s); }
    function concat(...arrs) {
      const total = arrs.reduce((a, b) => a + b.length, 0);
      const out = new Uint8Array(total); let off = 0;
      arrs.forEach(a => { out.set(a, off); off += a.length; });
      return out;
    }
    function setPngDpi(uint8, dpi) {
      const ppm = Math.round(dpi / 0.0254);
      const signature = uint8.slice(0, 8);
      let pos = 8;
      const before = [];
      let idatChunk = null, idatPos = 0;
      while (pos < uint8.length) {
        const len = (uint8[pos] << 24) | (uint8[pos + 1] << 16) | (uint8[pos + 2] << 8) | uint8[pos + 3];
        const type = String.fromCharCode(...uint8.slice(pos + 4, pos + 8));
        const data = uint8.slice(pos + 8, pos + 8 + len);
        const crc = uint8.slice(pos + 8 + len, pos + 12 + len);
        if (type === 'IDAT') { idatChunk = concat(u32be(len), strBytes(type), data, crc); idatPos = pos; break; }
        before.push(concat(u32be(len), strBytes(type), data, crc));
        pos += 12 + len;
      }
      if (!idatChunk) throw new Error('PNG 中未找到 IDAT 数据块');
      const phyData = new Uint8Array(9);
      const ppmBytes = u32be(ppm);
      phyData.set(ppmBytes, 0); phyData.set(ppmBytes, 4); phyData[8] = 1;
      const phyType = strBytes('pHYs');
      const phyCrc = u32be(crc32(concat(phyType, phyData)));
      const phyChunk = concat(u32be(9), phyType, phyData, phyCrc);
      const afterPos = idatPos + 12 + idatChunk.length - 12; // idatChunk already includes 12-byte header
      const after = uint8.slice(afterPos);
      return concat(signature, ...before, phyChunk, idatChunk, after);
    }
    function setJpegDpi(uint8, dpi) {
      if (uint8[0] !== 0xFF || uint8[1] !== 0xD8) throw new Error('不是 JPEG 文件');
      const dpiBytes = [(dpi >> 8) & 0xFF, dpi & 0xFF];
      let pos = 2;
      if (uint8[pos] === 0xFF && uint8[pos + 1] === 0xE0) {
        const len = (uint8[pos + 2] << 8) | uint8[pos + 3];
        const seg = uint8.slice(pos + 4, pos + 2 + len);
        const id = String.fromCharCode(...seg.slice(0, 5));
        if (id === 'JFIF\0') {
          const out = new Uint8Array(uint8.length);
          out.set(uint8.slice(0, pos + 4 + 7));
          out.set([1], pos + 4 + 7); // unit = inch
          out.set(dpiBytes, pos + 4 + 8);
          out.set(dpiBytes, pos + 4 + 10);
          out.set(uint8.slice(pos + 4 + 12), pos + 4 + 12);
          return out;
        }
        pos += 2 + len;
      }
      const app0 = new Uint8Array([0xFF, 0xE0, 0x00, 0x10, ...strBytes('JFIF\0'), 0x01, 0x01, 0x01, ...dpiBytes, ...dpiBytes, 0x00, 0x00]);
      const out = new Uint8Array(app0.length + uint8.length);
      out.set(uint8.slice(0, 2), 0);
      out.set(app0, 2);
      out.set(uint8.slice(2), 2 + app0.length);
      return out;
    }

    function roundedRect(ctx, x, y, w, h, r) {
      const rr = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + rr, y);
      ctx.lineTo(x + w - rr, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
      ctx.lineTo(x + w, y + h - rr);
      ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
      ctx.lineTo(x + rr, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
      ctx.lineTo(x, y + rr);
      ctx.quadraticCurveTo(x, y, x + rr, y);
      ctx.closePath();
    }

        { value: 'center', text: '居中' },
        { value: 'tl', text: '左上' },
        { value: 'tr', text: '右上' },
        { value: 'bl', text: '左下' },

      ]);

        ctx.drawImage(img, 0, 0);
        ctx.font = `bold ${size.value}px system-ui, sans-serif`;
        ctx.fillStyle = color.value;
        ctx.globalAlpha = +opacity.value / 100;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        const metrics = ctx.measureText(text.value);
        let x = c.width / 2, y = c.height / 2;
        const pad = 30;
        switch (pos.value) {
          case 'tl': x = pad + metrics.width / 2; y = pad + +size.value / 2; break;
          case 'tr': x = c.width - pad - metrics.width / 2; y = pad + +size.value / 2; break;
          case 'bl': x = pad + metrics.width / 2; y = c.height - pad - +size.value / 2; break;
          case 'br': x = c.width - pad - metrics.width / 2; y = c.height - pad - +size.value / 2; break;
        }
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(+angle.value * Math.PI / 180);
        ctx.fillText(text.value, 0, 0);
        ctx.restore();
        ctx.globalAlpha = 1;
        const blob = await canvasToBlob(c);

          const ctx = c.getContext('2d');
          ctx.drawImage(img, 0, 0);
          const d = ctx.getImageData(0, 0, c.width, c.height);
          const s = +strength.value;
          for (let i = 0; i < d.data.length; i += 4) {
            const noise = (Math.random() - 0.5) * 2 * s;
            d.data[i] = Math.min(255, Math.max(0, d.data[i] + noise));
            d.data[i + 1] = Math.min(255, Math.max(0, d.data[i + 1] + noise));
            d.data[i + 2] = Math.min(255, Math.max(0, d.data[i + 2] + noise));
          }
          ctx.putImageData(d, 0, 0);
          const blob = await canvasToBlob(c);
          items.push({ blob, name: prefixName(f.name, 'unique_') });

      }

      function messageControls(msg) {
        const wrap = document.createElement('div'); wrap.className = 'wx-field'; wrap.style.flex = '1';
        if (msg.type === 'text') {
          const ta = document.createElement('textarea'); ta.placeholder = '输入文字'; ta.rows = 2; ta.value = msg.content;
          ta.oninput = () => { msg.content = ta.value; renderPreview(); }; wrap.appendChild(ta);
        } else if (msg.type === 'time') {
          const inp = document.createElement('input'); inp.type = 'text'; inp.value = msg.time;
          inp.oninput = () => { msg.time = inp.value; renderPreview(); }; wrap.appendChild(inp);
        } else if (msg.type === 'image') {
          const file = document.createElement('input'); file.type = 'file'; file.accept = 'image/*';
          const thumb = document.createElement('img'); thumb.className = 'wx-avatar-thumb'; thumb.style.marginTop = '6px'; thumb.style.display = msg.image ? 'block' : 'none';
          if (msg.image) thumb.src = msg.image;
          file.onchange = async () => { const f = file.files[0]; if (f) { msg.image = await readFile(f); thumb.src = msg.image; thumb.style.display = 'block'; } renderPreview(); };
          wrap.appendChild(file); wrap.appendChild(thumb);
        } else if (msg.type === 'voice') {
          const row = document.createElement('div'); row.className = 'wx-row';
          const secIn = document.createElement('input'); secIn.type = 'number'; secIn.min = 1; secIn.value = msg.seconds; secIn.style.width = '70px';
          secIn.oninput = () => { msg.seconds = +secIn.value; renderPreview(); };
          const readLabel = document.createElement('label'); readLabel.className = 'wx-toggle'; readLabel.style.fontSize = '0.78rem';
          const readCheck = document.createElement('input'); readCheck.type = 'checkbox'; readCheck.checked = msg.isRead;
          readCheck.onchange = () => { msg.isRead = readCheck.checked; renderPreview(); };
          const slider = document.createElement('span'); slider.className = 'slider';
          const readSpan = document.createElement('span'); readSpan.textContent = '已读';
          readLabel.appendChild(readCheck); readLabel.appendChild(slider); readLabel.appendChild(readSpan);
          row.appendChild(secIn); row.appendChild(readLabel);
          wrap.appendChild(row);
          const presets = document.createElement('div'); presets.className = 'wx-voice-durations';
          [1, 2, 3, 5, 10, 15, 30, 60].forEach(v => {
            const b = document.createElement('button'); b.textContent = v + '"'; b.className = v === msg.seconds ? 'active' : '';
            b.onclick = () => { msg.seconds = v; renderMsgList(); renderPreview(); };
            presets.appendChild(b);
          });
          wrap.appendChild(presets);
        } else if (msg.type === 'redpacket') {
          const row = document.createElement('div'); row.className = 'wx-row';
          const amountIn = document.createElement('input'); amountIn.type = 'number'; amountIn.step = '0.01'; amountIn.value = msg.amount; amountIn.style.width = '90px';
          amountIn.oninput = () => { msg.amount = amountIn.value; renderPreview(); };
          const remarkIn = document.createElement('input'); remarkIn.type = 'text'; remarkIn.placeholder = '备注'; remarkIn.value = msg.remark;
          remarkIn.oninput = () => { msg.remark = remarkIn.value; renderPreview(); };
          row.appendChild(amountIn); row.appendChild(remarkIn);
          wrap.appendChild(row);
          const presets = document.createElement('div'); presets.className = 'wx-amount-presets';
          ['0.01', '6.66', '8.88', '66.66', '88.88', '100', '200'].forEach(v => {
            const b = document.createElement('button'); b.textContent = '¥' + v;
            b.onclick = () => { msg.amount = v; renderMsgList(); renderPreview(); };
            presets.appendChild(b);
          });
          wrap.appendChild(presets);
        } else if (msg.type === 'transfer') {
          const row = document.createElement('div'); row.className = 'wx-row';
          const amountIn = document.createElement('input'); amountIn.type = 'number'; amountIn.step = '0.01'; amountIn.value = msg.amount; amountIn.style.width = '90px';
          amountIn.oninput = () => { msg.amount = amountIn.value; renderPreview(); };
          const remarkIn = document.createElement('input'); remarkIn.type = 'text'; remarkIn.placeholder = '备注'; remarkIn.value = msg.remark;
          remarkIn.oninput = () => { msg.remark = remarkIn.value; renderPreview(); };
          row.appendChild(amountIn); row.appendChild(remarkIn);
          wrap.appendChild(row);
          const presets = document.createElement('div'); presets.className = 'wx-amount-presets';
          ['1', '10', '50', '100', '500', '1000', '5200'].forEach(v => {
            const b = document.createElement('button'); b.textContent = '¥' + v;
            b.onclick = () => { msg.amount = v; renderMsgList(); renderPreview(); };
            presets.appendChild(b);
          });
          wrap.appendChild(presets);
        } else if (msg.type.endsWith('-call')) {
          const row = document.createElement('div'); row.className = 'wx-row';
          const contactWrap = document.createElement('label'); contactWrap.className = 'wx-field'; contactWrap.style.flex = '0 0 120px';
          const cspan = document.createElement('span'); cspan.textContent = '通话对象';
          const csel = document.createElement('select');
          state.users.filter(u => u.id !== 'u0').forEach(u => { const o = document.createElement('option'); o.value = u.id; o.textContent = u.name; csel.appendChild(o); });
          if (!csel.options.length) { const o = document.createElement('option'); o.value = 'u0'; o.textContent = state.users[0].name; csel.appendChild(o); }
          csel.value = msg.contactId || csel.options[0].value;
          csel.onchange = () => { msg.contactId = csel.value; renderPreview(); };
          contactWrap.appendChild(cspan); contactWrap.appendChild(csel);
          const statusWrap = document.createElement('label'); statusWrap.className = 'wx-field'; statusWrap.style.flex = '0 0 120px';
          const sspan = document.createElement('span'); sspan.textContent = '通话状态';
          const ssel = document.createElement('select');
          [['outgoing', '拨出'], ['incoming', '来电'], ['connected', '接通'], ['missed', '未接'], ['rejected', '已拒绝']].forEach(([v, t]) => { const o = document.createElement('option'); o.value = v; o.textContent = t; ssel.appendChild(o); });
          ssel.value = msg.status || 'outgoing';
          ssel.onchange = () => { msg.status = ssel.value; renderPreview(); };
          statusWrap.appendChild(sspan); statusWrap.appendChild(ssel);
          const durIn = document.createElement('input'); durIn.type = 'text'; durIn.value = msg.duration || '00:32'; durIn.style.width = '80px';
          durIn.oninput = () => { msg.duration = durIn.value; renderPreview(); };
          row.appendChild(contactWrap); row.appendChild(statusWrap); row.appendChild(durIn);
          wrap.appendChild(row);
        }
        return wrap;
      }

      function renderCallRecord(msg) {
        const isVideo = msg.type === 'video-call';
        const label = isVideo ? '视频通话' : '语音通话';
        let text = label;
        switch (msg.status) {
          case 'outgoing': text = label + ' 已取消'; break;
          case 'incoming': text = label + ' 未接听'; break;
          case 'missed': text = '未接' + label; break;
          case 'rejected': text = label + ' 已拒绝'; break;
          case 'connected': text = label + ' ' + escapeHtml(msg.duration || '00:00'); break;
        }
        const icon = isVideo ? '▶' : '📞';
        return `<div class="wx-call-record"><span class="icon">${icon}</span><span>${text}</span></div>`;
      }

      function renderCallOverlay(msg) {
        const isVideo = msg.type === 'video-call';
        const contact = state.users.find(u => u.id === msg.contactId) || state.users[0];
        const avatar = contact.avatar ? `<img src="${contact.avatar}" alt="">` : `<span>${escapeHtml(contact.name.slice(0, 1))}</span>`;
        let statusText = '';
        switch (msg.status) {
          case 'outgoing': statusText = isVideo ? '正在等待对方接受邀请…' : '正在呼叫…'; break;
          case 'incoming': statusText = isVideo ? '邀请你视频通话' : '邀请你语音通话'; break;
          case 'connected': statusText = escapeHtml(msg.duration || '00:00'); break;
          case 'missed': statusText = '未接听'; break;
          case 'rejected': statusText = '对方已拒绝'; break;
        }
        const actionHangup = `<div class="wx-call-action hangup"><div class="icon">📞</div><div class="label">挂断</div></div>`;
        const actionMute = `<div class="wx-call-action mute"><div class="icon">🎙</div><div class="label">静音</div></div>`;
        const actionSpeaker = `<div class="wx-call-action speaker"><div class="icon">🔊</div><div class="label">免提</div></div>`;
        const actionAccept = `<div class="wx-call-action accept"><div class="icon">📞</div><div class="label">接听</div></div>`;
        const actionSwitch = `<div class="wx-call-action video-switch"><div class="icon">🔄</div><div class="label">切换</div></div>`;
        const actions = msg.status === 'incoming'
          ? actionAccept + actionHangup
          : (isVideo ? actionMute + actionSwitch + actionHangup : actionMute + actionSpeaker + actionHangup);
        return `<div class="wx-call-overlay"><div class="call-statusbar">${escapeHtml(state.status.time)}</div><div class="call-top-hint">${isVideo ? '微信视频通话' : '微信语音通话'}</div><div class="wx-call-avatar" style="border-radius:${isVideo ? '50%' : '16px'}">${avatar}</div><div class="wx-call-name">${escapeHtml(contact.name)}</div><div class="wx-call-status">${statusText}</div><div class="wx-call-actions">${actions}</div></div>`;
      }

      function renderMessage(msg) {
        if (msg.type === 'time') return `<div class="wx-time"><span>${escapeHtml(msg.time)}</span></div>`;
        if (msg.type.endsWith('-call')) return renderCallRecord(msg);
        const user = state.users.find(u => u.id === msg.senderId) || state.users[0];
        const isMe = msg.senderId === 'u0';
        const avatar = user.avatar ? `<img src="${user.avatar}" alt="">` : `<span>${escapeHtml(user.name.slice(0, 1))}</span>`;
        const voiceWave = `<span class="wx-voice-wave"><i></i><i></i><i></i></span>`;
        let content = '';
        switch (msg.type) {
          case 'text': content = `<div class="wx-bubble">${escapeHtml(msg.content)}</div>`; break;
          case 'image': content = `<div class="wx-bubble wx-img-msg">${msg.image ? `<img src="${msg.image}">` : ''}</div>`; break;
          case 'voice': content = `<div class="wx-bubble wx-voice">${isMe ? `<span>${msg.seconds}"</span>${voiceWave}` : `${voiceWave}<span>${msg.seconds}"</span>${!msg.isRead ? '<span class="wx-voice-unread"></span>' : ''}`}</div>`; break;
          case 'redpacket': content = `<div class="wx-bubble wx-trans"><div class="wx-trans-content redp"><div class="wx-trans-icon">🧧</div><div><span>${escapeHtml(msg.remark || '恭喜发财，大吉大利')}</span><font>微信红包</font></div></div><div class="wx-trans-bottom"><span>微信红包</span></div></div>`; break;
          case 'transfer': content = `<div class="wx-bubble wx-trans"><div class="wx-trans-content"><div class="wx-trans-icon">💰</div><div><span>¥${escapeHtml(msg.amount)}</span><font>${escapeHtml(msg.remark || '转账')}</font></div></div><div class="wx-trans-bottom"><span>微信转账</span></div></div>`; break;
        }
        return `<div class="wx-msg-row ${isMe ? 'right' : 'left'}"><div class="wx-avatar" style="border-color:${user.frameColor}">${avatar}</div><div class="wx-bubble-wrap">${content}</div></div>`;
      }

      let previewTimer;
      function renderPreview() {
        clearTimeout(previewTimer);
        previewTimer = setTimeout(() => _renderPreview(), 60);
      }
      function _renderPreview() {
        const screen = $('wxScreen'); if (!screen) return;
        const s = state.status;
        screen.className = 'wx-screen ' + (s.theme === 'dark' ? 'dark' : 'light');
        const sigHtml = `<div class="wx-signal">${[1, 2, 3, 4].map(i => `<i class="${i <= s.signal ? 'on' : ''}"></i>`).join('')}</div>`;
        const netHtml = s.network === 'wifi' ? `<div class="wx-wifi">${[1, 2, 3].map(i => `<i class="${i <= s.wifi ? 'on' : ''}"></i>`).join('')}</div>` : `<span class="wx-net">${s.network.toUpperCase()}</span>`;
        const batteryHtml = `<div class="wx-battery ${s.charging ? 'charging' : ''}"><div class="wx-battery-body"><div class="wx-battery-fill" style="width:${s.battery}%"></div>${s.charging ? '<span class="bolt">⚡</span>' : ''}</div><span>${s.battery}%</span></div>`;
        const statusHtml = `<div class="wx-statusbar"><div class="wx-status-left"><span>${escapeHtml(s.time)}</span>${sigHtml}${netHtml}</div><div class="wx-status-right">${batteryHtml}</div></div>`;
        const earpieceIcon = `<span class="wx-earpiece" title="听筒模式"><svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg></span>`;
        const navHtml = `<div class="wx-navbar"><div class="wx-nav-left"><div class="wx-back"></div>${s.unread > 0 ? `<span class="wx-unread">${s.unread}</span>` : ''}</div><div class="wx-nav-center"><div class="wx-nav-title">${escapeHtml(s.title)}${s.earpiece ? earpieceIcon : ''}</div></div><div class="wx-nav-right"><div class="wx-dots"><i></i><i></i><i></i></div></div></div>`;
        const bgStyle = s.bg ? `background-image:url(${s.bg});background-size:cover;background-position:center;` : '';
        const msgsHtml = state.messages.map(renderMessage).join('');
        const chatHtml = `<div class="wx-chat" style="${bgStyle}">${msgsHtml}</div>`;
        const voiceIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>`;
        const emojiIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>`;
        const plusIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>`;
        const inputBar = `<div class="wx-inputbar"><div class="wx-input-btn voice">${voiceIcon}</div><div class="wx-input ${s.voice ? 'say' : ''}">${s.voice ? '按住 说话' : ''}</div><div class="wx-input-btn emoji">${emojiIcon}</div><div class="wx-input-btn more">${plusIcon}</div></div><div class="wx-homebar"><i></i></div>`;
        screen.innerHTML = statusHtml + navHtml + chatHtml + inputBar;
        screen.querySelectorAll('.wx-avatar').forEach((av, idx) => {
          const msg = state.messages.filter(m => m.type !== 'time' && !m.type.endsWith('-call'))[idx];
          if (!msg) return;
          const user = state.users.find(u => u.id === msg.senderId);
          if (!user) return;
          av.title = '点击更换头像';
          av.onclick = () => {
            const input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*';
            input.onchange = async () => { const f = input.files[0]; if (f) { user.avatar = await readFile(f); renderUsers(); renderPreview(); } };
            input.click();
          };
        });
        const last = state.messages[state.messages.length - 1];
        if (last && last.type.endsWith('-call')) {
          const overlay = document.createElement('div');
          overlay.innerHTML = renderCallOverlay(last);
          screen.appendChild(overlay.firstElementChild);
        }
        fitPhone();
      }

      function fitPhone() {
        const right = $('wxRight');
        const phone = $('wxPhone');
        if (!right || !phone) return;
        requestAnimationFrame(() => {
          const pad = 40;
          const maxW = right.clientWidth - pad;
          const maxH = right.clientHeight - pad;
          const scale = Math.min(maxW / 1170, maxH / 2532, 1);
          phone.style.setProperty('--wx-scale', scale.toFixed(4));
        });
      }

      function exportImage() {
        if (typeof html2canvas === 'undefined') return alert('html2canvas 未加载');
        html2canvas($('wxScreen'), { scale: 1, width: 1170, height: 2532, backgroundColor: null, useCORS: true, logging: false }).then(canvas => {
          canvas.toBlob(blob => saveAs(blob, 'wechat_screen_1170x2532.png'));
        });
      }
      function exportVideo() {
        if (typeof html2canvas === 'undefined') return alert('html2canvas 未加载');
        html2canvas($('wxScreen'), { scale: 1, width: 1170, height: 2532, backgroundColor: null, useCORS: true, logging: false }).then(canvas => {
          const stream = canvas.captureStream(30);
          const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm;codecs=vp8';
          const rec = new MediaRecorder(stream, { mimeType: mime });
          const chunks = [];
          rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
          rec.onstop = () => { saveAs(new Blob(chunks, { type: 'video/webm' }), 'wechat_screen_1170x2532.webm'); };
          rec.start();
          setTimeout(() => rec.stop(), 3000);
        });
      }
      function exportGif() {
        if (typeof html2canvas === 'undefined' || typeof gifshot === 'undefined') return alert('导出库未加载');
        html2canvas($('wxScreen'), { scale: 1, width: 1170, height: 2532, backgroundColor: null, useCORS: true, logging: false }).then(canvas => {
          const dataUrl = canvas.toDataURL('image/png');
          gifshot.createGIF({ images: [dataUrl], gifWidth: canvas.width, gifHeight: canvas.height, interval: 0.5 }, obj => {
            if (obj.error) return alert('GIF 生成失败：' + (obj.errorCode || obj.errorMsg));
            saveAs(dataURLtoBlob(obj.image), 'wechat_screen_1170x2532.gif');
          });
        });
      }

      renderUsers(); renderMsgList(); renderPreview();
      window.addEventListener('resize', fitPhone);
    };

    // ---------- rendering ----------
    let currentCat = 'all';
    function renderTabs() {
      const tabs = $('tabs'); tabs.innerHTML = '';
      categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'tab' + (cat.id === currentCat ? ' active' : '');
        btn.textContent = cat.name;
        btn.onclick = () => { currentCat = cat.id; renderTabs(); renderGrid(); };
        tabs.appendChild(btn);
      });
    }
    function renderGrid() {
      const grid = $('grid'); grid.innerHTML = '';
      const q = $('searchInput').value.trim().toLowerCase();
      const list = tools.filter(t => (currentCat === 'all' || t.cat === currentCat) &&
        (!q || t.name.includes(q) || t.desc.toLowerCase().includes(q)));
      list.forEach(t => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<h3>${t.name}</h3><p>${t.desc}</p><span class="badge">${categories.find(c => c.id === t.cat)?.name || ''}</span>`;
        card.onclick = () => openTool(t.id);
        grid.appendChild(card);
      });
      if (!list.length) grid.innerHTML = '<div class="empty" style="grid-column:1/-1;text-align:center;padding:40px;">没有找到匹配的工具</div>';
    }
    function openTool(id) {
      const t = tools.find(x => x.id === id);
      if (!t || !toolSetups[id]) return;
      clearModal();
      $('modalTitle').textContent = t.name;
      $('modalDesc').textContent = t.desc;
      toolSetups[id]();
      $('modal').classList.add('open');
    }
    $('closeBtn').onclick = () => $('modal').classList.remove('open');
    $('modal').onclick = e => { if (e.target === $('modal')) $('modal').classList.remove('open'); };
    $('searchInput').oninput = renderGrid;

    // ---------- starfield ----------
    function makeStars() {
      const stars = $('stars');
      for (let i = 0; i < 130; i++) {
        const s = document.createElement('div');
        s.className = 'star';
        const size = Math.random() < 0.8 ? Math.random() * 2 + 1 : Math.random() * 3 + 2;
        s.style.width = size + 'px'; s.style.height = size + 'px';
        s.style.left = Math.random() * 100 + '%';
        s.style.top = Math.random() * 100 + '%';
        s.style.setProperty('--dur', (Math.random() * 3 + 2) + 's');
        s.style.setProperty('--op', (Math.random() * 0.6 + 0.3).toFixed(2));
        if (Math.random() > 0.7) s.style.boxShadow = `0 0 ${size * 2}px ${['var(--accent1)', 'var(--accent2)', 'var(--accent3)', 'var(--accent4)'][Math.floor(Math.random() * 4)]}`;
        stars.appendChild(s);
      }
      for (let i = 0; i < 4; i++) {
        const sh = document.createElement('div');
        sh.className = 'shooting';
        sh.style.top = Math.random() * 60 + '%';
        sh.style.left = Math.random() * 40 + '%';
        sh.style.animationDelay = (i * 1.5) + 's';
        sh.style.animationDuration = (4 + Math.random() * 3) + 's';
        stars.appendChild(sh);
      }
    }

    renderTabs(); renderGrid(); makeStars();
  </script>
</body>
</html>
